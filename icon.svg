<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AB47BC"/>
      <stop offset="50%" stop-color="#7E57C2"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,220)" fill="#FFFFFF">
    <!-- 左上翅 -->
    <ellipse cx="-80" cy="-50" rx="75" ry="90" transform="rotate(20,-80,-50)"/>
    <!-- 右上翅 -->
    <ellipse cx="80" cy="-50" rx="75" ry="90" transform="rotate(-20,80,-50)"/>
    <!-- 左下翅 -->
    <ellipse cx="-55" cy="40" rx="55" ry="65" transform="rotate(35,-55,40)" opacity="0.7"/>
    <!-- 右下翅 -->
    <ellipse cx="55" cy="40" rx="55" ry="65" transform="rotate(-35,55,40)" opacity="0.7"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="0" rx="12" ry="80"/>
  </g>
  <!-- 触角 -->
  <path d="M-4,-240 C-20,-280 -50,-290 -70,-300" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M4,-240 C20,-280 50,-290 70,-300" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
